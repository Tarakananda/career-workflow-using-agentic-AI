[project]
name = "job-agent"
version = "0.1.0"
description = "AI agent that reads resume and applies for matching jobs"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "openai>=1.0",
    "rapidfuzz>=3.0",
    "tiktoken>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
# Agent Matching Configuration
matching_config:
  # Minimum percentage of skills that must match for the agent to apply
  min_match_percentage: 80
  
  # Weight categories (higher = more important)
  category_weights:
    aws_core_services: 1.5
    iac_tools: 1.5
    ci_cd_tools: 1.3
    container_orchestration: 1.5
    monitoring_observability: 1.2
    security_tools: 1.2
    scripting_languages: 1.1
    version_control: 1.0
    infrastructure_as_code: 1.3
    gitops_tools: 1.3
    service_mesh: 1.0
    finops_tools: 1.0
    dr_backup: 1.0
    databases: 1.0
    networking: 1.0
    ml_ai: 0.5
    serverless: 1.0
    devops_culture: 1.0

  # Required categories (must have at least 50% match in each)
  required_categories:
    - aws_core_services
    - iac_tools
    - container_orchestration
    - ci_cd_tools
    - monitoring_observability
    - security_tools

  # Skill aliases for matching (e.g., "k8s" -> "kubernetes")
  skill_aliases:
    "k8s": "kubernetes"
    "aws cloud": "aws"
    "azure cloud": "azure"

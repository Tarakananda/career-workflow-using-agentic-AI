# AWS DevOps Engineer Skills Reference List
# This file contains all skills relevant to AWS DevOps Engineer roles.
# The agent will check both the job description and your resume against this list.
# If skill match > 80%, the agent will apply.
# 
# Instructions:
# - Review each category and remove tools/skills you DON'T have
# - Add any missing skills you possess that aren't listed
# - The agent calculates weighted match percentage based on this list

